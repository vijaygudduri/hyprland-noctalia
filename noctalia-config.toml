[bar.default]
background_opacity = 0.74999998323619366
capsule = true
capsule_fill = "#1E1F27"
center = [ "battery", "date", "clock"]
end = [ "group:g1", "network", "group:g2", "notifications" ]
margin_edge = 0
margin_ends = 20
scale = 1.1000000000000001
start = [ "privacy", "volume", "brightness", "taskbar" ]
thickness = 39

    [[bar.default.capsule_group]]
    fill = "#1E1F27"
    id = "g1"
    members = [ "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "#1E1F27"
    id = "g2"
    members = [ "bluetooth", "battery_3" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 160.0
    box_width = 256.0
    cx = 160.0
    cy = 184.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        font_family = ""

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 64.0
    box_width = 160.0
    cx = 144.0
    cy = 312.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[location]
address = "Bayyaram, india"

[osd]
position = "top_center"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/vijay/Downloads/80 Coffee_albedo.png"
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    transparency_mode = "soft"

[system.monitor]
network_poll_seconds = 2

[theme]
builtin = "Rosé Pine"
community_palette = "Solarized"
custom_palette = "Ayu"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
